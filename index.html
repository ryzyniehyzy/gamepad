<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FIFA Street Pad</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  body { margin: 0; background: #0d0d14; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #top { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 6px; background: #181824; border-bottom: 1px solid #333; }
  input { padding: 5px; border-radius: 5px; border: 1px solid #555; background: #000; color: #0f0; font-weight: bold; width: 110px; text-align: center; text-transform: uppercase; }
  button { padding: 6px 12px; border-radius: 5px; border: none; background: #00e676; font-weight: bold; }
  #pad { flex: 1; position: relative; width: 100%; }
  .trig { position: absolute; top: 8px; width: 95px; height: 38px; background: #252538; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
  #l1 { left: 15px; } #l2 { left: 120px; } #r2 { right: 120px; } #r1 { right: 15px; }
  .stick-zone { position: absolute; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 2px solid #444; }
  #left-zone { bottom: 25px; left: 25px; }
  #right-zone { bottom: 15px; right: 175px; width: 115px; height: 115px; border-color: #f59e0b; }
  .knob { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: rgba(0,230,118,0.7); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #right-zone .knob { background: rgba(245,158,11,0.7); }
  .actions { position: absolute; bottom: 35px; right: 20px; width: 145px; height: 145px; }
  .btn { position: absolute; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .y { top: 0; left: 48px; background: #f59e0b; } .a { bottom: 0; left: 48px; background: #10b981; }
  .x { top: 48px; left: 0; background: #3b82f6; } .b { top: 48px; right: 0; background: #ef4444; }
  .meta { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
  .m-btn { padding: 6px 14px; background: #252538; border: 1px solid #666; border-radius: 12px; font-size: 11px; }
  .active { filter: brightness(1.6); border-color: #00e676 !important; }
</style>
</head>
<body>
  <div id="top">
    <input id="code" placeholder="KOD Z PC" maxlength="4">
    <button id="conn-btn">POŁĄCZ</button>
    <span id="stat" style="font-size:12px;color:#aaa;">Rozłączony</span>
  </div>
  <div id="pad">
    <div class="trig" id="l1" data-b="4">L1 (Triki)</div>
    <div class="trig" id="l2" data-b="6">L2 (Kontrola)</div>
    <div class="trig" id="r2" data-b="7">R2 (Panna)</div>
    <div class="trig" id="r1" data-b="5">R1 (Sprint)</div>
    <div class="meta">
      <div class="m-btn" data-b="8">SELECT</div>
      <div class="m-btn" data-b="9">START</div>
    </div>
    <div class="stick-zone" id="left-zone"><div class="knob" id="l-knob"></div></div>
    <div class="stick-zone" id="right-zone"><div class="knob" id="r-knob"></div></div>
    <div class="actions">
      <div class="btn y" data-b="3">△</div>
      <div class="btn b" data-b="1">○</div>
      <div class="btn x" data-b="2">□</div>
      <div class="btn a" data-b="0">✕</div>
    </div>
  </div>
<script>
  const peer = new Peer();
  let conn = null;
  const state = { buttons: {}, axes: [0, 0, 0, 0] };
  const send = () => { if (conn && conn.open) conn.send(state); };

  document.getElementById('conn-btn').onclick = () => {
    const c = document.getElementById('code').value.trim().toUpperCase();
    if (!c) return;
    conn = peer.connect('FIFA-PAD-' + c);
    conn.on('open', () => { document.getElementById('stat').innerText = 'OK!'; document.getElementById('stat').style.color = '#0f0'; });
  };

  document.querySelectorAll('[data-b]').forEach(el => {
    const b = el.getAttribute('data-b');
    el.addEventListener('touchstart', e => { e.preventDefault(); state.buttons[b] = 1; el.classList.add('active'); send(); });
    el.addEventListener('touchend', e => { e.preventDefault(); state.buttons[b] = 0; el.classList.remove('active'); send(); });
  });

  function setupStick(zoneId, knobId, axX, axY) {
    const zone = document.getElementById(zoneId), knob = document.getElementById(knobId);
    const max = 45;
    const move = (e) => {
      e.preventDefault();
      const t = e.targetTouches[0];
      if (!t) return;
      const r = zone.getBoundingClientRect();
      let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
      const dist = Math.hypot(dx, dy);
      if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      state.axes[axX] = +(dx / max).toFixed(2);
      state.axes[axY] = +(dy / max).toFixed(2);
      send();
    };
    const end = (e) => {
      e.preventDefault();
      knob.style.transform = 'translate(-50%, -50%)';
      state.axes[axX] = 0; state.axes[axY] = 0;
      send();
    };
    zone.addEventListener('touchstart', move);
    zone.addEventListener('touchmove', move);
    zone.addEventListener('touchend', end);
  }
  setupStick('left-zone', 'l-knob', 0, 1);
  setupStick('right-zone', 'r-knob', 2, 3);
</script>
</body>
</html>
